# Opt-in Docker override for testing a local modern kicad_monkey monorepo.
# Use together with docker-compose.yml; normal Compose builds remain pinned to
# the published pair in requirements/runtime.lock. KICAD_TOOLCHAIN_CONTEXT may
# name another checkout; the default remains the adjacent historical location.
#
# The local Python toolchain remains useful for upstream parity experiments.
# PCB semantic geometry itself uses Prism's pinned Rust helper.
services:
  backend:
    build:
      additional_contexts:
        kicad_toolchain: ${KICAD_TOOLCHAIN_CONTEXT:-../kicad_monkey}
      args:
        KICAD_MONKEY_VARIANT: kicad-monkey-local
    environment:
      - PRISM_PCB_GEOMETRY_BACKEND=rust

  catalog-worker:
    build:
      additional_contexts:
        kicad_toolchain: ${KICAD_TOOLCHAIN_CONTEXT:-../kicad_monkey}
      args:
        KICAD_MONKEY_VARIANT: kicad-monkey-local

  prism-worker:
    build:
      additional_contexts:
        kicad_toolchain: ${KICAD_TOOLCHAIN_CONTEXT:-../kicad_monkey}
      args:
        KICAD_MONKEY_VARIANT: kicad-monkey-local
    environment:
      - PRISM_PCB_GEOMETRY_BACKEND=rust
