name: Quality gate

on:
  pull_request:
    branches:
      - dev
      - main
      - feature/release-studio
  push:
    branches:
      - dev
      - main
      - feature/release-studio
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build application
        run: npm run build

      - name: Build Remote Symbol Provider panel
        run: npm run build:panel

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kicad_prism_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kicad_prism_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      AUTH_ENABLED: "false"
      DEV_GUEST_ROLE: admin
      KICAD_PROJECTS_ROOT: ${{ github.workspace }}/.ci-data/projects
      PRISM_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/kicad_prism_test
      # The catalog integration suite refuses to run against the application
      # database, because it drops and rebuilds schema objects. Pointing both
      # names at one database silently skipped the entire suite.
      TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/kicad_prism_catalog_test

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Create the isolated catalog test database
        run: psql "$PRISM_DATABASE_URL" -c 'CREATE DATABASE kicad_prism_catalog_test'

      - name: Compile Python sources
        run: python -m compileall -q app

      - name: Run backend tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Require the catalog integration suite to have run
        run: |
          # These tests skip themselves when TEST_POSTGRES_URL is missing or
          # points at the application database, so a silent skip looks green.
          python -m unittest tests.test_component_catalog_postgres_integration -v 2>&1 | tee result.log
          if grep -q "skipped" result.log; then
            echo "Catalog integration tests skipped; check TEST_POSTGRES_URL." >&2
            exit 1
          fi

  semantic-viewer:
    name: Semantic viewer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: kicad-prism-viewer

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kicad-prism-viewer/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kicad-prism-viewer/requirements-runtime.txt

      - name: Install dependencies
        run: |
          npm ci
          # The pinned kicad-monkey release, so the compiler is tested against
          # the same geometry conventions the default image ships with.
          python -m pip install -r requirements-runtime.txt

      - name: Test glTF conversion
        run: npm run test:gltf

      - name: Test viewer
        run: npm run test:viewer

      - name: Test topology compiler
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build viewer bundles
        run: npm run build

  deployment-config:
    name: Deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate default Compose configuration
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet

      - name: Validate reverse-proxy Compose configuration
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.proxy.yml config --quiet

      - name: Prepare load-test configuration
        run: touch loadtest/.env.loadtest

      - name: Validate load-test Compose configuration
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.loadtest.yml config --quiet

      - name: Validate local kicad-monkey Compose configuration
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.local-kicad-monkey.yml config --quiet

      - name: Validate pull-only release Compose configuration
        env:
          POSTGRES_PASSWORD: ci-release-validation
          PRISM_ENV_FILE: .env.example
        working-directory: deploy/release
        run: |
          docker compose --env-file .env.example -f compose.yml config --quiet
          docker compose --env-file .env.example -f compose.yml --profile proxy config --quiet
          if grep -Eq '^[[:space:]]*build:' compose.yml; then
            echo "Release Compose must not contain build directives." >&2
            exit 1
          fi

      - name: Test release metadata and bundle generation
        run: python3 -m unittest scripts.test_release_bundle

      - name: Test the deployment installer
        working-directory: scripts
        run: python3 -m unittest test_prism_deploy

      - name: Test the backup tool
        working-directory: scripts
        run: python3 -m unittest test_prism_backup

      - name: Validate generated Compose configuration for every scheme
        run: |
          set -euo pipefail
          for scheme in tailscale tailscale-host dns-01 http-01 internal-ca external-proxy plain-http; do
            python3 - "$scheme" > /tmp/answers.json <<'PY'
          import json, sys
          scheme = sys.argv[1]
          answers = {
              "scheme": scheme,
              "hostname": "prism.example.com",
              "oidc_issuer": "https://sso.example.com",
              "oidc_client_id": "kicad-prism",
              "oidc_client_secret": "ci-placeholder",
              "bootstrap_admins": "admin@example.com",
          }
          if scheme == "dns-01":
              answers.update(
                  dns_provider="cloudflare",
                  dns_credential="abcdefghij0123456789ABCDEFGHIJ0123456789",
              )
          if scheme == "internal-ca":
              answers["certificate_dir"] = "./deploy/certs"
          if scheme.startswith("tailscale"):
              answers["scheme"] = "tailscale"
              answers["hostname"] = "prism.tail1a2b3c.ts.net"
              if scheme == "tailscale-host":
                  answers["ts_mode"] = "host"
              else:
                  answers["ts_authkey"] = "tskey-auth-ci-placeholder"
          print(json.dumps(answers))
          PY
            mkdir -p deploy/certs && touch deploy/certs/prism.crt deploy/certs/prism.key
            python3 -m scripts.prism_deploy --answers /tmp/answers.json --skip-preflight
            # Renders the overlay, then asks Compose whether it merges cleanly.
            eval "$(python3 -c "
          import json, sys
          sys.path.insert(0, 'scripts')
          from prism_deploy import render
          answers = render.normalise(json.load(open('/tmp/answers.json')))
          print(' '.join(render.compose_command(answers, 'config', '--quiet')))
          ")"
            echo "  $scheme: compose configuration is valid"
          done

  kicad-live:
    name: Release Studio live KiCad
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build backend image from Dockerfile KiCad default
        run: >-
          docker build
          --platform linux/amd64
          --build-arg KICAD_BASE_PLATFORM=linux/amd64
          --tag release-studio-live-kicad:ci
          --file backend/Dockerfile
          .

      - name: Run Release Studio live KiCad tests
        run: |
          set -euo pipefail
          BAKED_IMAGE="$(docker run --rm --entrypoint /bin/cat release-studio-live-kicad:ci /etc/prism/kicad-base-image | tr -d '\r\n')"
          if [[ ! "$BAKED_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "baked KiCad base image must end with @sha256:<64 lowercase hex>; got: ${BAKED_IMAGE}" >&2
            exit 1
          fi
          export PRISM_RELEASE_EXECUTOR_IMAGE="$BAKED_IMAGE"
          echo "PRISM_RELEASE_EXECUTOR_IMAGE=${PRISM_RELEASE_EXECUTOR_IMAGE}"

          docker run --rm \
            --platform linux/amd64 \
            --env "PRISM_RELEASE_EXECUTOR_IMAGE=${PRISM_RELEASE_EXECUTOR_IMAGE}" \
            --entrypoint /app/venv/bin/python \
            release-studio-live-kicad:ci \
            -m tests.release_studio_live_runner

  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs:
      - frontend
      - backend
      - semantic-viewer
      - deployment-config
      - kicad-live
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every quality job
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          VIEWER_RESULT: ${{ needs.semantic-viewer.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment-config.result }}
          KICAD_LIVE_RESULT: ${{ needs.kicad-live.result }}
        run: |
          test "$FRONTEND_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          test "$VIEWER_RESULT" = "success"
          test "$DEPLOYMENT_RESULT" = "success"
          test "$KICAD_LIVE_RESULT" = "success"
