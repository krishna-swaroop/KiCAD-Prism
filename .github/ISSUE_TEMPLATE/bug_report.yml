name: Bug report
description: Report reproducible incorrect behavior in KiCAD Prism
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        **Tip:** in Prism, open **Help → Report a bug** (the **?** button in the header). It opens this form with *Prism version* and *Diagnostics* already filled in; nothing is sent until you submit here.

        Search existing issues first. Do not include credentials, private repositories, proprietary designs, database dumps, or security vulnerabilities.

  - type: input
    id: version
    attributes:
      label: Prism version
      description: Filled in by Report a bug. Otherwise the release tag or full commit SHA from Help → About.
      placeholder: v4.0.0-alpha or abcdef123...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Filled in by Report a bug. Otherwise open Help → About, click **Copy version info**, and paste it here.
        It lists build revisions, the ECAD viewer and KiCad CLI versions, the sign-in method, your browser, and the kind of page you were on. It never includes project, user, or host names; review it anyway.
      render: text

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Deployment or upgrade
        - Authentication or access
        - Workspace or Git import
        - Schematic, PCB, 3D, BOM, or cross-probe
        - Design Comparison
        - Comments
        - Issue tracker publishing
        - Release Studio
        - Workflows or Assets
        - Library Manager
        - Remote Symbol Provider
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: What Prism cannot see from the browser. How Prism was installed, where it runs, and anything between the browser and Prism.
      placeholder: |
        Installed with: release bundle / deploy.sh from source / dev server
        Host: Ubuntu 24.04, amd64
        Docker: 28.x / Compose v2.x
        Reverse proxy: bundled Caddy / nginx / none
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a small public project or sanitized example when possible
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Optional, and your choice what to share. Remove tokens, cookies, private URLs, identities, and design data.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched existing open and closed issues.
          required: true
        - label: I removed secrets and proprietary data.
          required: true
        - label: This is not a security vulnerability.
          required: true
