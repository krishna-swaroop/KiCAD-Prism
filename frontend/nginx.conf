server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Docker's embedded DNS. Resolve upstreams at request time so a recreated
    # `backend` container (new IP) does not leave this proxy stuck on a 502
    # until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA routing - serve index.html for all non-file routes.
    #
    # index.html names the hashed chunks of one build, so it must be
    # revalidated on every load. Without Cache-Control the browser caches it
    # heuristically (10% of its Last-Modified age, often days), keeps booting a
    # previous build after a redeploy, and then asks for chunks that no longer
    # exist.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Vite chunks are content-hashed, so a name never changes meaning. A
    # missing chunk is a 404, not the SPA page: answering with index.html
    # turns a stale-build miss into a confusing MIME error and lets the
    # browser cache HTML under a script URL. No "always": a 404 must not be
    # cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Viewer adapters change independently from Vite's hashed application chunks.
    # Always revalidate them; the explicit query tags in index.html provide an
    # additional release boundary for already-open browser sessions.
    location ~ ^/(ecad-viewer|prism-semantic-viewer)\.js$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Proxy API requests to backend
    location /api/ {
        # Catalog folder capture streams individual KiCad assets. Keep this in
        # sync with CATALOG_IMPORT_MAX_FILE_BYTES; the backend remains the
        # authoritative per-file and aggregate limiter.
        client_max_body_size 2g;
        client_body_timeout 3600s;
        proxy_request_buffering off;
        set $prism_backend backend:8000;
        proxy_pass http://$prism_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Prefer outer TLS proto; fall back to $scheme for direct HTTP access.
        proxy_set_header X-Forwarded-Proto $prism_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        # Large first-time projects can take longer than nginx's 60s default to
        # produce their lightweight semantic sidecar. The browser request is
        # independent of SCH/PCB rendering and subsequent reads are cached.
        proxy_read_timeout 300s;
    }

    # Authenticated backend routes may hand immutable project assets to nginx
    # after authorization. "internal" prevents direct URL access.
    location /_protected_projects/ {
        internal;
        alias /srv/prism-projects/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # KiCad remote-provider discovery and OAuth endpoints
    location = /.well-known/kicad-remote-provider {
        set $prism_backend backend:8000;
        proxy_pass http://$prism_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $prism_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /oauth/ {
        set $prism_backend backend:8000;
        proxy_pass http://$prism_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $prism_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /remote-provider/ {
        set $prism_backend backend:8000;
        proxy_pass http://$prism_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $prism_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
}
