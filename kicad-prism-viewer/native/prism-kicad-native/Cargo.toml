[package]
name = "prism-kicad-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.102"
earcutr = "0.5.0"
# krishna-swaroop/kicad_monkey fork, analytic materializer branch. Bump with
# src/contract.rs, copper_geometry.py and the vendored analytic WASM.
kicad-monkey-core = { git = "https://github.com/krishna-swaroop/kicad_monkey", rev = "b6316117901b344114385242b0ad13be45dfefae" }
kicad-monkey-materialization-pack = { git = "https://github.com/krishna-swaroop/kicad_monkey", rev = "b6316117901b344114385242b0ad13be45dfefae" }
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[build-dependencies]
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
